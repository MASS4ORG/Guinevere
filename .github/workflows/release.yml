name: release

on:
    schedule:
        - cron: "0 13 * * *" # 10:00 BRT (UTC-3, no DST)
    workflow_dispatch:

jobs:
    ubuntu-latest:
        name: ubuntu-latest
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "10.0.x"
            - name: "Cache: .nuke/temp, ~/.nuget/packages"
              uses: actions/cache@v6
              with:
                  path: |
                      .nuke/temp
                      ~/.nuget/packages
                  key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
            - name: "Run: Test, GitHubCreateRelease"
              run: ./build.cmd Test GitHubCreateRelease
              env:
                  GitHubToken: ${{ secrets.GITHUB_TOKEN }}
            - name: "Publish: coverage.xml"
              uses: actions/upload-artifact@v7
              with:
                  name: coverage.xml
                  path: coverage/coverage.xml
            # The tag above is created through the API with GITHUB_TOKEN, which does not
            # fire `on: push: tags`. Kick the publish workflow explicitly; a workflow_dispatch
            # via `gh` does run even when triggered with GITHUB_TOKEN. Safe to run every time —
            # PublishNuGet pushes with --skip-duplicate.
            - name: "Trigger: publish-on-tag"
              if: success()
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh workflow run publish-on-tag.yml --ref main
        permissions:
            contents: write
            actions: write
