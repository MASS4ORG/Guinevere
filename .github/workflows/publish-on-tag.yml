# Publishes the NuGet packages for a release.
#
# Trusted Publishing (OIDC) — no long-lived NuGet API key. nuget.org must have a
# Trusted Publishing policy for this repo + this workflow file:
#   Repository Owner: MASS4ORG   Repository: Guinevere   Workflow File: publish-on-tag.yml
# and the repo needs a `NUGET_USER` secret set to the nuget.org account/profile name
# that owns the `MASS4.*` packages.
#
# Triggered by `release.yml` via `gh workflow run` after it cuts a tag (a tag push made
# with GITHUB_TOKEN does not fire `on: push`), or manually via the Actions tab.

name: publish-on-tag

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: read
    id-token: write # required for the OIDC token exchange with nuget.org

jobs:
    ubuntu-latest:
        name: ubuntu-latest
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"
            - name: "Cache: .nuke/temp, ~/.nuget/packages"
              uses: actions/cache@v4
              with:
                  path: |
                      .nuke/temp
                      ~/.nuget/packages
                  key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
            - name: "NuGet login (OIDC -> short-lived API key)"
              uses: NuGet/login@v1
              id: nuget-login
              with:
                  user: ${{ secrets.NUGET_USER }}
            - name: "Run: Release (build, test, pack, publish, examples)"
              run: ./build.cmd Release
              env:
                  NuGetApiKey: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
                  GitHubToken: ${{ secrets.GITHUB_TOKEN }}
            - name: "Publish: packages"
              uses: actions/upload-artifact@v4
              with:
                  name: packages
                  path: packages
            - name: "Publish: examples-output"
              uses: actions/upload-artifact@v4
              with:
                  name: examples-output
                  path: examples-output
