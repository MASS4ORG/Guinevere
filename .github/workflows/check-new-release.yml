# Tags and publishes a release, but only where the `RELEASE_REPOSITORY` variable is set.
# Forks leave it unset so their copies never tag or release; they receive the upstream commit and
# tag by mirroring and nothing more.
name: Check new release

on:
    schedule:
        - cron: "0 13 * * *" # 10:00 BRT (UTC-3, no DST)
    workflow_dispatch:

jobs:
    ubuntu-latest:
        name: ubuntu-latest
        if: ${{ vars.RELEASE_REPOSITORY != '' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "10.0.x"
            - name: "Cache: .nuke/temp, ~/.nuget/packages"
              uses: actions/cache@v6
              with:
                  path: |
                      .nuke/temp
                      ~/.nuget/packages
                  key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
            - name: "Run: Test, GitHubCreateRelease"
              run: ./build.cmd Test GitHubCreateRelease
              env:
                  GitHubToken: ${{ secrets.GITHUB_TOKEN }}
            - name: "Publish: coverage.xml"
              uses: actions/upload-artifact@v7
              with:
                  name: coverage.xml
                  path: coverage/coverage.xml
            # A tag pushed with GITHUB_TOKEN starts no workflows, so publish-on-tag.yml is dispatched for it
            # explicitly, on the tag itself so the packages are built from the tagged commit.
            - name: "Trigger: publish-on-tag"
              if: success()
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="$(git tag --points-at HEAD | head -n1)"
                  if [ -n "$tag" ]; then
                    gh workflow run publish-on-tag.yml --ref "$tag"
                  fi
        permissions:
            contents: write
            actions: write
